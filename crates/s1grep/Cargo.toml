[package]
name = "s1grep"
description = "Find code by asking what it does, with System One decision models running locally"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
s1-engine.workspace = true
s1-index.workspace = true
serde.workspace = true
clap.workspace = true
anyhow.workspace = true
serde_json.workspace = true
ort.workspace = true
ureq = { version = "3", default-features = false, features = ["rustls", "json"] }
sha2 = "0.10"
getrandom = "0.3"
indicatif = "0.18"
console = "0.16"
dunce = "1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"
