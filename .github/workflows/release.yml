name: Release

on:
  push:
    tags:
      - "[0-9]*.[0-9]*.[0-9]*"
  # Manual fallback for a tag whose push created no run. Run it against the tag, never a branch:
  # the version comes from GITHUB_REF_NAME.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & publish the Linux and Windows binaries
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      - name: Check the tag matches Cargo.toml
        run: |
          CARGO_VERSION=$(sed -n '/^\[workspace.package\]/,/^\[/s/^version = "\(.*\)"/\1/p' Cargo.toml)
          [ "$GITHUB_REF_NAME" = "$CARGO_VERSION" ] || {
            echo "::error::Tag $GITHUB_REF_NAME does not match Cargo.toml ($CARGO_VERSION)"; exit 1; }

      - name: Build and pack
        run: make dist

      - name: Smoke test
        run: target/release/s1grep --version

      - name: Extract changelog entry
        id: changelog
        run: |
          BODY=$(awk "/^## \[${GITHUB_REF_NAME}\]/{found=1; next} found && /^## /{exit} found{print}" CHANGELOG.md)
          echo "body<<EOF" >> "$GITHUB_OUTPUT"
          echo "$BODY" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "${{ github.ref_name }}"
          body: |
            ${{ steps.changelog.outputs.body }}

            ---

            ## Install

            Linux (x86-64, glibc 2.38 or newer):

            ```bash
            curl -fsSL https://raw.githubusercontent.com/apiservicesac/s1grep/main/install.sh | bash
            ```

            Pin this version with `--version ${{ github.ref_name }}`. Already installed? Update in place:

            ```bash
            curl -fsSL https://raw.githubusercontent.com/apiservicesac/s1grep/main/update.sh | bash
            ```

            Windows (x86-64), in PowerShell:

            ```powershell
            irm https://raw.githubusercontent.com/apiservicesac/s1grep/main/install.ps1 | iex
            ```

            Running it again updates s1grep in place.
          files: |
            dist/${{ github.ref_name }}/s1grep-${{ github.ref_name }}-x86_64-linux
            dist/${{ github.ref_name }}/s1grep-${{ github.ref_name }}-x86_64-windows.exe
            dist/${{ github.ref_name }}/onnxruntime.dll
            dist/${{ github.ref_name }}/SHA256SUMS
            install.sh
            update.sh
            install.ps1
